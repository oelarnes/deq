<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEq: Estimated Draft Equity</title>
    <link href="_static/styles/theme.css" rel="stylesheet" />
    <link href="_static/styles/pydata-sphinx-theme.css" rel="stylesheet" />
    <link rel="stylesheet" type="text/css" href="_static/pygments.css" />
    <link rel="stylesheet" type="text/css" href="_static/styles/sphinx-book-theme.css" />
    <link rel="stylesheet" type="text/css" href="_static/togglebutton.css" />
    <link rel="stylesheet" type="text/css" href="_static/copybutton.css" />
    <link rel="stylesheet" type="text/css" href="_static/mystnb.4510f1fc1dee50b3e5859aac5469c37c29e427902b24a333a5f9fcb2f0b3ac41.css" />
    <link rel="stylesheet" type="text/css" href="_static/sphinx-thebe.css" />
    <link rel="stylesheet" type="text/css" href="_static/sphinx-design.min.css" />
    <link rel="stylesheet" type="text/css" href="_static/.ipynb_checkpoints/style-checkpoint.css" />
    <link rel="stylesheet" type="text/css" href="_static/style.css?v={version}" />
    <link rel="icon" href="_static/deq.png"/> 
</head>
<body>
    <div class="deq-container">
        <div class="header">
            <div class="deq-logo">DEq</div>
        </div>

        <div class="info-list-container">
            <ul class="info-list">
                <li class="dropdown" id="dropdown">
                    <select onChange="window.location.href=this.value" name="set-code" id="link-select">
                        {select_elements}
                    </select>
                <!--
                    <button class="cell-content dropdown-toggle" id="dropdownToggle">
                        {set_code}
                    </button>
                    <div class="dropdown-menu">
                        <button class="dropdown-item" data-link="deq-eoe.html">EOE</button>
                        <button class="dropdown-item" data-link="deq-tdm.html">TDM</button>
                    </div>               
                -->
                </li>
                <li>
                    <div class="cell-content"> {player_cohort} players </div>
                </li>
                <li>
                    <div class="cell-content"> {start_date} </div>
                </li>
                <li>
                    <div class="cell-content"> {end_date} </div>
                </li>
                <li>
                    <div class="cell-content"> <a href="deq-docs.html">docs</a> </div>
                </li>
            </ul>
        </div>
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput"
                placeholder='try "B !rare !mythic "common'
                autocomplete="off"
            >
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th class="col-hidden">Rank</th>
                        <th>Grade</th>
                        <th>DEq</th>
                        <th>Name</th>
                        <th>Color</th>
                        <th class="col-hidden">Rarity</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
            <div id="noResults" class="no-results" style="display: none;">
                No results found for your search.
            </div>
        </div>
    </div>
    <script>
        const deq_table = JSON.parse(`{deq_table}`)

        function deqFormat(num) {{
            return typeof(num) === "number" ? num.toLocaleString('en-US', {{
                style: 'percent',
                minimumFractionDigits: 2, 
                maximumFractionDigits: 2,
                signDisplay: 'always',
            }}) : "N/A"
        }}

        // Function to render table
        function renderTable(data) {{
            const tbody = document.getElementById('tableBody');
            const noResults = document.getElementById('noResults');
            
            if (data.length === 0) {{
                tbody.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }}
            
            noResults.style.display = 'none';
            
            tbody.innerHTML = data.map((row, i) => `
                <tr>
                    <td class="col-hidden">${{i + 1}}</td>
                    <td>${{row.deq_grade}}</td>
                    <td>${{deqFormat(row.deq)}}</td>
                    <td>${{row.name}}</td>
                    <td>${{row.color}}</td>
                    <td class="col-hidden">${{row.rarity}}</td>
                </tr>
            `).join('');
        }}

        // Function to filter data
        function filterData(searchTerm) {{
            if (!searchTerm.trim()) {{
                return deq_table;
            }}
            
            const terms = searchTerm.toLowerCase().split(/\s+/).filter(term => term.length > 0);

            const quoteChars = ['“', '”', '"'];
            const inexactTerms = terms.filter(term => {{
                return !quoteChars.some(char => term.includes(char)) & !term.includes('!')
            }});
            const exactTerms = terms.filter(
                term => quoteChars.some(char => term.includes(char))
            ).map(term => term.replaceAll(/"|“|”/g, ''));
            const notTerms = terms.filter(
                term => term.includes('!')
            ).map(term => term.replaceAll('!', ''));
            
            return deq_table.filter(row => {{
                const {{name, color, rarity}} = row
                const rowText = [name, color, rarity].join(' ').toLowerCase();
                return inexactTerms.every(
                    term => rowText.includes(term)
                ) & exactTerms.every(
                    term => rowText.split(' ').filter(word => word.toLowerCase() === term).length > 0
                ) & !notTerms.some(term => rowText.includes(term))
            }});
        }}

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        let searchTimeout;

        searchInput.addEventListener('input', function() {{
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {{
                const filteredData = filterData(this.value);
                renderTable(filteredData);
            }}, 150);
        }});

        // Add some visual feedback for search
        searchInput.addEventListener('focus', function() {{
            this.style.transform = 'translateY(-2px)';
        }});

        searchInput.addEventListener('blur', function() {{
            this.style.transform = 'translateY(0)';
        }});

        renderTable(deq_table)
    </script>

</body>
</html>
