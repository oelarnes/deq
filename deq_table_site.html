<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEq</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            line-height: 1.4;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 2rem 1rem;
            text-align: center;
            border-bottom: 1px solid #333;
        }

        .logo {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, #00d4ff 0%, #0099cc 50%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 30px rgba(0, 212, 255, 0.3);
            letter-spacing: -0.05em;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .search-container {
            margin-bottom: 2rem;
            position: relative;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1.5rem;
            background: #1a1a1a;
            border: 2px solid #333;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #00d4ff;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.2);
        }

        .search-input::placeholder {
            color: #666;
        }

        .table-container {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
        }

        th {
            padding: 1rem;
            text-align: left;
            font-weight: 600;
            color: #00d4ff;
            border-bottom: 2px solid #333;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #222;
            transition: background-color 0.2s ease;
        }

        tbody tr:hover {
            background-color: #1a1a1a;
        }

        .number {
            font-family: 'Monaco', 'Menlo', monospace;
            text-align: right;
        }

        /* Mobile-first: Hide columns by default */
        .col-hidden {
            display: none;
        }

        /* Show all columns on larger screens */
        @media (min-width: 768px) {
            .col-hidden {
                display: table-cell;
            }
        }

        .no-results {
            text-align: center;
            padding: 3rem;
            color: #666;
            font-style: italic;
        }

        /* Responsive adjustments */
        @media (max-width: 480px) {
            .logo {
                font-size: 2.5rem;
            }
            
            .header {
                padding: 1.5rem 1rem;
            }
            
            th, td {
                padding: 0.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">DEq</div>
    </div>

    <div class="container">
        <div class="search-container">
            <input 
                type="text" 
                class="search-input" 
                id="searchInput"
                placeholder="Search entries..."
                autocomplete="off"
            >
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>DEq</th>
                        <th>Grade</th>
                        <th class="col-hidden">Score</th>
                        <th class="col-hidden">Rating</th>
                        <th class="col-hidden">Performance</th>
                        <th class="col-hidden">Efficiency</th>
                        <th class="col-hidden">Quality</th>
                        <th class="col-hidden">Status</th>
                        <th class="col-hidden">Category</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Sample data - will be replaced by Python script -->
                </tbody>
            </table>
            <div id="noResults" class="no-results" style="display: none;">
                No results found for your search.
            </div>
        </div>
    </div>

    <script>
        // Sample data for testing - will be replaced by Python script
        const sampleData = [
            { name: "Alpha Project", deq: "A1", grade: "Excellent", score: 94.5, rating: 8.7, performance: 92.1, efficiency: 87.3, quality: 95.8, status: "Active", category: "Research" },
            { name: "Beta System", deq: "B2", grade: "Good", score: 82.1, rating: 7.2, performance: 85.4, efficiency: 79.8, quality: 81.7, status: "Pending", category: "Development" },
            { name: "Gamma Protocol", deq: "C1", grade: "Fair", score: 76.3, rating: 6.8, performance: 78.9, efficiency: 74.2, quality: 75.8, status: "Review", category: "Testing" },
            { name: "Delta Framework", deq: "A2", grade: "Excellent", score: 91.7, rating: 8.4, performance: 89.3, efficiency: 93.1, quality: 92.8, status: "Active", category: "Framework" },
            { name: "Epsilon Module", deq: "B1", grade: "Good", score: 85.2, rating: 7.6, performance: 83.7, efficiency: 86.4, quality: 85.9, status: "Active", category: "Module" },
            { name: "Zeta Interface", deq: "C2", grade: "Fair", score: 72.8, rating: 6.3, performance: 71.2, efficiency: 74.5, quality: 72.7, status: "Inactive", category: "Interface" },
            { name: "Eta Component", deq: "A3", grade: "Excellent", score: 96.1, rating: 9.1, performance: 94.8, efficiency: 97.3, quality: 96.7, status: "Active", category: "Component" },
            { name: "Theta Service", deq: "B3", grade: "Good", score: 88.4, rating: 8.0, performance: 87.6, efficiency: 89.1, quality: 88.9, status: "Active", category: "Service" }
        ];

        // Function to format numbers
        function formatNumber(num) {
            return typeof num === 'number' ? num.toFixed(1) : num;
        }

        // Function to render table
        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            const noResults = document.getElementById('noResults');
            
            if (data.length === 0) {
                tbody.innerHTML = '';
                noResults.style.display = 'block';
                return;
            }
            
            noResults.style.display = 'none';
            
            tbody.innerHTML = data.map(row => `
                <tr>
                    <td>${row.name}</td>
                    <td>${row.deq}</td>
                    <td>${row.grade}</td>
                    <td class="col-hidden number">${formatNumber(row.score)}</td>
                    <td class="col-hidden number">${formatNumber(row.rating)}</td>
                    <td class="col-hidden number">${formatNumber(row.performance)}</td>
                    <td class="col-hidden number">${formatNumber(row.efficiency)}</td>
                    <td class="col-hidden number">${formatNumber(row.quality)}</td>
                    <td class="col-hidden">${row.status}</td>
                    <td class="col-hidden">${row.category}</td>
                </tr>
            `).join('');
        }

        // Function to filter data
        function filterData(searchTerm) {
            if (!searchTerm.trim()) {
                return sampleData;
            }
            
            const terms = searchTerm.toLowerCase().split(/\s+/).filter(term => term.length > 0);
            
            return sampleData.filter(row => {
                const rowText = Object.values(row).join(' ').toLowerCase();
                return terms.every(term => rowText.includes(term));
            });
        }

        // Search functionality
        const searchInput = document.getElementById('searchInput');
        let searchTimeout;

        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                const filteredData = filterData(this.value);
                renderTable(filteredData);
            }, 150);
        });

        // Initial render
        renderTable(sampleData);

        // Add some visual feedback for search
        searchInput.addEventListener('focus', function() {
            this.style.transform = 'translateY(-2px)';
        });

        searchInput.addEventListener('blur', function() {
            this.style.transform = 'translateY(0)';
        });
    </script>
</body>
</html>
